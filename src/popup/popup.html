<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="extName">Moodrop</title>
  <link rel="stylesheet" href="../ui.css" />
  <style>
    body { width: 340px; padding: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 12px; }
    header h1 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    header h1 img { border-radius: 5px; }
    #recent { max-height: 240px; overflow: auto; }
    .setup { margin-bottom: 10px; box-shadow: 0 0 0 1px rgba(10, 132, 255, 0.45); }
    .empty { padding: 16px 14px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1><img src="../../icons/icon48.png" width="22" height="22" alt="" />Moodrop</h1>
    <button id="opts" class="link" type="button" data-i18n="navAria">Settings</button>
  </header>

  <div class="card setup" id="setup-card" hidden>
    <div class="row">
      <div class="grow">
        <div class="title" data-i18n="setupTitle">Finish setting up</div>
        <div class="path" data-i18n="setupBody">No save folder has been chosen yet</div>
      </div>
      <button id="setup-go" class="primary" type="button" data-i18n="btnContinue">Continue</button>
    </div>
  </div>

  <div class="card" id="site-card" hidden>
    <div class="row">
      <div class="grow">
        <div class="title" id="site-title"></div>
        <div class="path" id="site-sub"></div>
      </div>
      <button id="site-enable" class="primary" type="button" hidden data-i18n="btnEnable">Enable</button>
      <span id="site-on" class="badge ok" hidden data-i18n="badgeOn">On</span>
    </div>
  </div>

  <h2 data-i18n="rootDefaultName">Save folder</h2>
  <div class="card">
    <div class="row">
      <div class="grow">
        <div class="title" id="root-name" data-i18n="rootNone">Not set</div>
      </div>
      <button id="root-set" type="button" data-i18n="btnChoose">Choose…</button>
    </div>
  </div>

  <h2 data-i18n="h2Recent">Recent saves</h2>
  <div class="card" id="recent"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
