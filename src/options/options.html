<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodrop 設定</title>
  <link rel="stylesheet" href="../ui.css" />
  <style>
    main { max-width: 640px; margin: 0 auto; padding: 36px 20px 60px; }
    .welcome { margin-bottom: 8px; }
    .welcome h1 { font-size: 24px; letter-spacing: -0.02em; }
    .add { display: flex; gap: 8px; padding: 12px 14px; border-top: 0.5px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <header class="welcome">
      <h1>Moodrop</h1>
      <p class="muted">Moodleの資料を、ワンクリックで好きなフォルダへ。</p>
    </header>

    <h2>保存先フォルダ</h2>
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="title" id="root-name">未設定</div>
          <div class="path" id="root-note">資料はこの中に科目ごとのフォルダを作って保存されます。</div>
        </div>
        <span id="root-badge" class="badge" hidden></span>
        <button id="regrant" type="button" hidden>再許可</button>
        <button id="pick" class="primary" type="button">選ぶ…</button>
      </div>
    </div>
    <p class="hint" style="margin:8px 4px 0">
      Google ドライブ / OneDrive / Box / iCloud などのデスクトップアプリの同期フォルダも選べます。
    </p>
    <p id="pick-msg" class="hint" style="margin:6px 4px 0"></p>

    <h2>使うMoodleサイト</h2>
    <div class="card">
      <div id="sites"></div>
      <div class="add">
        <input id="site-url" type="url" placeholder="https://moodle.example.ac.jp/" aria-label="MoodleのURL" />
        <button id="site-add" type="button">追加</button>
      </div>
    </div>
    <p class="hint" style="margin:8px 4px 0">
      Moodleのページを開いてツールバーの Moodrop を押すと、そのサイトを有効にできます。
    </p>
    <p id="site-msg" class="hint" style="margin:6px 4px 0"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
