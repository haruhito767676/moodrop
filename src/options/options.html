<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moodrop 設定</title>
  <link rel="stylesheet" href="../ui.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="設定">
      <div class="brand">
        <img src="../../icons/icon128.png" width="28" height="28" alt="" />
        <span>Moodrop</span>
      </div>
      <a href="#general" data-pane="general">一般</a>
      <a href="#courses" data-pane="courses">科目</a>
      <a href="#sites" data-pane="sites">Moodleサイト</a>
    </nav>

    <main>
      <section id="general" class="pane">
        <h1>一般</h1>

        <h2>保存先フォルダ</h2>
        <div class="card">
          <div class="row">
            <div class="grow">
              <div class="title" id="root-name">未設定</div>
              <div class="path" id="root-note">資料はこの中に、科目ごとのフォルダを作って保存されます。</div>
            </div>
            <span id="root-badge" class="badge" hidden></span>
            <button id="regrant" type="button" hidden>再許可</button>
            <button id="pick" class="primary" type="button">選ぶ…</button>
          </div>
        </div>
        <p class="hint">Google ドライブ / OneDrive / Box / iCloud などのデスクトップアプリの同期フォルダも選べます。</p>
        <p id="pick-msg" class="hint"></p>

        <h2>科目フォルダ</h2>
        <div class="card">
          <label class="row switch-row">
            <div class="grow">
              <div class="title">科目名で自動的に作成する</div>
              <div class="path">オフのときは、初めて保存する科目ごとに保存先を確認します。</div>
            </div>
            <input id="auto" type="checkbox" role="switch" class="switch" />
          </label>
        </div>
      </section>

      <section id="courses" class="pane" hidden>
        <h1>科目</h1>
        <p class="hint lead">科目ごとの保存先です。変更したい科目は「選び直す」を押すと、次に保存するときにもう一度選べます。</p>
        <div class="card" id="course-list"></div>
      </section>

      <section id="sites" class="pane" hidden>
        <h1>Moodleサイト</h1>
        <div class="card">
          <div id="site-list"></div>
          <div class="add">
            <input id="site-url" type="url" placeholder="https://moodle.example.ac.jp/" aria-label="MoodleのURL" />
            <button id="site-add" type="button">追加</button>
          </div>
        </div>
        <p class="hint">Moodleのページを開いて、ツールバーの Moodrop を押しても有効にできます。</p>
        <p id="site-msg" class="hint"></p>
      </section>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
