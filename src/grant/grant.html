<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="extName">Moodrop</title>
  <link rel="stylesheet" href="../ui.css" />
  <style>
    body.grant { display: grid; place-items: center; min-height: 100vh; text-align: center; }
    body.grant main { max-width: 360px; padding: 24px; }
    .app { width: 64px; height: 64px; border-radius: 15px; margin-bottom: 12px; }
    h1 { font-size: 17px; }
    #allow { margin: 12px 0 14px; padding: 8px 28px; font-size: 14px; }
    #msg { color: var(--danger); min-height: 1.4em; }
  </style>
</head>
<body class="grant">
  <main>
    <img class="app" src="../../icons/icon128.png" alt="" />
    <h1 data-i18n="grantTitle">Allow access to the save folder</h1>
    <p id="body" data-i18n="grantBody">Moodrop needs to confirm access to the save folder again. Press the button below and choose Allow in the prompt.</p>
    <button id="allow" class="primary" type="button" data-i18n="permAllow">Allow</button>
    <p class="hint" data-i18n="permHint">Choose “Allow on every visit” in the prompt to stop seeing this.</p>
    <p id="msg" class="hint"></p>
  </main>
  <script type="module" src="grant.js"></script>
</body>
</html>
