<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moodrop promo stage</title>
<style>
  :root { --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 810px; overflow: hidden; background: #000; }
  body { font-family: var(--font); color: #f5f5f7; -webkit-font-smoothing: antialiased; position: relative; }
  #wall { position: absolute; inset: 0; background:
      radial-gradient(900px 520px at 12% 8%, rgba(10,132,255,.30), transparent 62%),
      radial-gradient(800px 520px at 92% 96%, rgba(123,92,255,.28), transparent 62%), #050507; }
  #caption { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-weight: 700; font-size: 44px; letter-spacing: -.02em; white-space: nowrap; transition: opacity .35s, transform .35s; }
  #caption small { display: block; margin-top: 6px; font-weight: 500; font-size: 20px; letter-spacing: 0; color: rgba(235,235,245,.6); }
  #caption.out { opacity: 0; transform: translateY(-10px); }
  .win { position: absolute; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(255,255,255,.16), 0 40px 90px rgba(0,0,0,.65); transition: opacity .4s, transform .5s; }
  .nocap #browser { top: 82px; } .nocap #finder { top: 250px; }
  .win.hide { opacity: 0; transform: scale(.97); }
  .tl { display: flex; gap: 8px; }
  .tl i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .tl i:nth-child(2) { background: #febc2e; } .tl i:nth-child(3) { background: #28c840; }

  /* browser */
  #browser { left: 30px; top: 132px; width: 1000px; height: 646px; background: #fff; }
  .bbar { height: 46px; background: #e4e5e9; display: flex; align-items: center; gap: 14px; padding: 0 14px; }
  .btab { margin-left: 8px; height: 34px; align-self: flex-end; padding: 0 18px; border-radius: 9px 9px 0 0; background: #f4f5f7; color: #1d2125; font-size: 12.5px; display: flex; align-items: center; max-width: 330px; white-space: nowrap; overflow: hidden; }
  .btool { height: 40px; background: #f4f5f7; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #dadce0; }
  .url { flex: 1; height: 28px; border-radius: 14px; background: #e8eaed; color: #5f6368; font-size: 12.5px; display: flex; align-items: center; padding: 0 14px; }
  .btool img { width: 22px; height: 22px; border-radius: 5px; }
  #viewport { position: relative; width: 1000px; height: 560px; overflow: hidden; background: #fff; }
  #frame { position: absolute; left: 0; top: 0; width: 834px; height: 467px; border: 0; transform: scale(1.2); transform-origin: 0 0; background: #fff; }

  /* finder */
  #finder { left: 1046px; top: 300px; width: 364px; height: 410px; background: rgba(36,36,40,.94); backdrop-filter: blur(30px); }
  .ftitle { height: 44px; display: flex; align-items: center; padding: 0 14px; gap: 14px; background: rgba(255,255,255,.06); font-size: 13px; font-weight: 600; color: #e8e8ed; }
  .ftitle .tl { flex: none; } .ftitle span { flex: 1; text-align: center; margin-right: 52px; }
  .path { padding: 10px 16px 6px; font-size: 12px; color: rgba(235,235,245,.55); }
  .path b { color: #e8e8ed; font-weight: 600; }
  #flist { padding: 4px 10px; }
  .fr { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; animation: drop .5s cubic-bezier(.2,.9,.3,1); }
  .fr .ic { width: 22px; height: 26px; border-radius: 4px; display: grid; place-items: center; font-size: 7px; font-weight: 800; color: #fff; flex: none; }
  .fr .ic.pdf { background: #e5484d; } .fr .ic.ppt { background: #f08a24; } .fr .ic.doc { background: #3b82f6; }
  .fr .ic.dir { background: none; width: 26px; height: 22px; }
  .fr .nm { flex: 1; } .fr .meta { color: rgba(235,235,245,.5); font-size: 12px; }
  .fr.new { background: rgba(10,132,255,.32); }
  .fr.new.fade { background: transparent; transition: background 1.2s; }
  @keyframes drop { from { opacity: 0; transform: translateY(-12px) scale(.97); } }

  /* intro / outro */
  #title { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; opacity: 0; pointer-events: none; transition: opacity .5s; }
  #title.on { opacity: 1; }
  #title img { width: 170px; height: 170px; margin: 0 auto 4px; filter: drop-shadow(0 18px 44px rgba(10,100,255,.55)); }
  #title h1 { font-size: 78px; letter-spacing: -.035em; line-height: 1; }
  #title p { font-size: 28px; color: rgba(235,235,245,.7); letter-spacing: -.01em; }

  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; z-index: 50; transform: translate(-100px,-100px); filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  #cursor svg { display: block; }
  #cursor.down { transform-origin: 3px 3px; }
  #ripple { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); opacity: 0; pointer-events: none; z-index: 49; }
  #ripple.go { animation: rip .55s ease-out; }
  @keyframes rip { from { opacity: .9; transform: scale(.3); } to { opacity: 0; transform: scale(1.4); } }
</style>
</head>
<body>
<div id="wall"></div>
<div id="caption"></div>

<div id="browser" class="win">
  <div class="bbar"><div class="tl"><i></i><i></i><i></i></div><div class="btab" id="btab"></div></div>
  <div class="btool"><span style="color:#5f6368">‹ › ↻</span><div class="url" id="url"></div><img src="/icons/icon48.png" alt=""></div>
  <div id="viewport"><iframe id="frame"></iframe></div>
</div>

<div id="finder" class="win hide">
  <div class="ftitle"><div class="tl"><i></i><i></i><i></i></div><span id="ftitle"></span></div>
  <div class="path" id="fpath"></div>
  <div id="flist"></div>
</div>

<div id="title"><img src="/assets/icon-1024.png" alt=""><h1>Moodrop</h1><p id="tline"></p></div>
<div id="ripple"></div>
<div id="cursor"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 2l17 9.4-7.2 1.9 4.2 7.6-3.3 1.8-4.2-7.5L4.6 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>

<script>
const q = new URLSearchParams(location.search);
const lang = q.get('lang') || 'en', scene = q.get('scene') || 'one', nocap = q.get('nocap') === '1';
if (nocap) document.body.classList.add('nocap');
const L = lang === 'ja'
  ? { course: '情報工学I', root: '大学', univ: '東都大学', today: '今日', tab: '情報工学I', folder: 'フォルダ' }
  : { course: 'Intro to Computing', root: 'University', univ: 'Example University', today: 'Today', tab: 'Intro to Computing', folder: 'Folder' };
document.documentElement.lang = lang;
document.getElementById('btab').textContent = `${L.tab} – ${L.univ}`;
document.getElementById('url').textContent = 'moodle.example.ac.jp/course/view.php?id=5';
document.getElementById('ftitle').textContent = L.root;
const frame = document.getElementById('frame');
frame.src = `/promo/moodle.html?lang=${lang}&scene=${scene}`;

const flist = document.getElementById('flist'), fpath = document.getElementById('fpath');
const FOLDER_SVG = '<svg width="26" height="22" viewBox="0 0 26 22"><path d="M1 4a2.5 2.5 0 0 1 2.5-2.5h5.5c.8 0 1.5.3 2 .9l1.2 1.4H22.5A2.5 2.5 0 0 1 25 6.3V18a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 1 18z" fill="#5ab4ff"/></svg>';
const kindOf = (n) => /\.pdf$/i.test(n) ? 'pdf' : /\.pptx?$/i.test(n) ? 'ppt' : 'doc';
let seen = new Set();

window.stage = {
  doc: () => frame.contentDocument,
  // iframe 内の要素 → ステージ座標
  R(el) {
    const r = el.getBoundingClientRect(), f = frame.getBoundingClientRect(), s = f.width / frame.offsetWidth;
    return { x: f.left + r.left * s, y: f.top + r.top * s, w: r.width * s, h: r.height * s };
  },
  caption(text, sub) { if (nocap) return; const c = document.getElementById('caption'); c.classList.remove('out'); c.innerHTML = text + (sub ? `<small>${sub}</small>` : ''); },
  captionOut() { document.getElementById('caption').classList.add('out'); },
  showFinder(on = true) { document.getElementById('finder').classList.toggle('hide', !on); },
  setPath(parts) { fpath.innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<b>${p}</b>` : p).join(' › '); },
  addFile(name, folder) {
    const key = folder + '/' + name; if (seen.has(key)) return; seen.add(key);
    if (flist.dataset.f !== folder) { flist.innerHTML = ''; flist.dataset.f = folder; }
    stage.setPath([L.root, ...folder.split('/')]);
    const kind = kindOf(name);
    const r = document.createElement('div'); r.className = 'fr new';
    r.innerHTML = `<span class="ic ${kind}">${kind.toUpperCase()}</span><span class="nm">${name}</span><span class="meta">${L.today}</span>`;
    flist.prepend(r);
    setTimeout(() => r.classList.add('fade'), 700);
  },
  addFolders(names, hl) {
    names.forEach((n) => {
      const r = document.createElement('div'); r.className = 'fr' + (n === hl ? ' new' : '');
      r.innerHTML = `<span class="ic dir">${FOLDER_SVG}</span><span class="nm">${n}</span><span class="meta">${L.folder}</span>`;
      flist.appendChild(r);
    });
    stage.setPath([L.root]);
  },
  clearFinder() { flist.innerHTML = ''; flist.dataset.f = ''; seen = new Set(); },
  title(on, line) { const t = document.getElementById('title'); if (line) document.getElementById('tline').textContent = line; t.classList.toggle('on', on); },
  hideWindows(on) { if (on) stage.cursor(-100, -100); document.getElementById('browser').classList.toggle('hide', on); document.getElementById('finder').classList.add('hide'); },
  cursor(x, y, down) {
    const c = document.getElementById('cursor');
    c.style.transform = `translate(${x - 3}px, ${y - 2}px) scale(${down ? 0.88 : 1})`;
  },
  ripple(x, y) { const r = document.getElementById('ripple'); r.style.left = x + 'px'; r.style.top = y + 'px'; r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); },
};
window.addEventListener('message', (e) => { if (e.data && e.data.type === 'saved') stage.addFile(e.data.name, e.data.folder); });
window.__ready = new Promise((res) => frame.addEventListener('load', () => setTimeout(res, 900)));
</script>
</body>
</html>
